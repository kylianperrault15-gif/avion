<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id-Know | High-End Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;900&family=Rajdhani:wght@300;500&display=swap" rel="stylesheet">

    <style>
        /* --- STYLE --- */
        body { margin: 0; background-color: #000000; color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: radial-gradient(circle at center, #0b1525 0%, #000000 100%); }
        
        /* HEADER */
        header { position: fixed; top: 0; left: 0; width: 100%; padding: 30px 50px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; pointer-events: auto; cursor: pointer; letter-spacing: 2px; font-size: 1.8rem; text-shadow: 0 0 20px rgba(0,255,255,0.5); }
        .logo span { color: #00ffff; }
        .tagline { display: block; font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; font-weight: 700; color: #00ffff; letter-spacing: 4px; margin-top: 5px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
        
        /* UI MONDE */
        #world-ui { position: fixed; top: 50%; left: 15%; transform: translate(0, -50%); width: 350px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 1s ease 0.5s; }
        #world-ui.active { opacity: 1; pointer-events: auto; }
        #world-ui h2 { font-family: 'Orbitron'; font-size: 3rem; margin: 0 0 20px 0; border-left: 4px solid #00ffff; padding-left: 20px; text-shadow: 0 0 30px rgba(0,255,255,0.4); color: white; }
        #world-ui p { font-size: 1.2rem; line-height: 1.6; padding-left: 20px; color: #d0e0ff; font-weight: 500; text-shadow: 0 0 5px black; }
        
        .back-btn { margin-top: 30px; margin-left: 20px; background: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff; color: #00ffff; padding: 12px 35px; font-family: 'Orbitron'; font-size: 0.8rem; letter-spacing: 2px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .back-btn:hover { background: #00ffff; color: black; box-shadow: 0 0 25px #00ffff; }

        .scroll-indic { position: fixed; bottom: 40px; width: 100%; text-align: center; font-size: 0.8rem; letter-spacing: 4px; opacity: 0.8; animation: pulse 2s infinite; pointer-events: none; color: #00ffff; font-weight: 600; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        .virtual-scroll { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: scroll; z-index: 5; }
        .scroll-height { height: 250vh; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <header>
        <div class="logo" onclick="resetView()">ID-KNOW<span>.</span><span class="tagline">DIGITAL SOVEREIGNTY</span></div>
    </header>

    <div class="virtual-scroll" id="vScroll" onscroll="onScroll()"><div class="scroll-height"></div></div>
    <div class="scroll-indic">SCROLL TO INITIALIZE SYSTEM</div>

    <div id="world-ui">
        <h2 id="ui-title">TITLE</h2>
        <div id="ui-text"></div>
        <button class="back-btn" onclick="exitWorld()">RETURN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        const contentData = {
            "IDENTITY": { text: "Your digital DNA. We use Decentralized Identifiers (DID) to ensure your identity exists independently.", type: "DNA" },
            "CONTROL": { text: "Granular permissions dashboard. Revoke access to any service instantly. Biometrics stay local.", type: "FINGERPRINT" },
            "PROTECTION": { text: "A robust shield against external threats. Blocking trackers and invasive scripts.", type: "LOCK" },
            "ENCRYPTION": { text: "Multi-layer cryptography. Data encapsulated in an immutable digital vault.", type: "HYPERCUBE" },
            "CYBERSECURITY": { text: "360-degree defense. AI heuristics predict attacks and reinforce the perimeter.", type: "DOME" },
            "PRIVACY": { text: "Blind-Processing technology. We process requests without seeing the content.", type: "EYE" }
        };

        const state = { scroll: 0, targetScroll: 0, inWorld: false, isTransitioning: false, currentMesh: null };

        // --- SCENE ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const mainGroup = new THREE.Group(); scene.add(mainGroup);
        const shieldGroup = new THREE.Group(); mainGroup.add(shieldGroup);
        const illusGroup = new THREE.Group(); mainGroup.add(illusGroup);

        // --- 1. BOUCLIER ---
        const geo = new THREE.IcosahedronGeometry(1.5, 2);
        const wireMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
        shieldGroup.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), wireMat));
        
        const pointsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        shieldGroup.add(new THREE.Points(geo, pointsMat));

        const glowSphere = new THREE.Mesh(
            new THREE.IcosahedronGeometry(1.4, 2),
            new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, side: THREE.BackSide })
        );
        shieldGroup.add(glowSphere);

        // --- NOUVEAUX ANNEAUX TECH ---
        // Plus de tubes ronds, on utilise des géométries plus complexes et tranchantes
        function createTechRing(r) {
            const g = new THREE.Group();
            
            // 1. Rail Principal (Blanc, très fin)
            // RadialSegments: 4 = Profil Carré/Diamant (tranchant)
            const mainGeo = new THREE.TorusGeometry(r, 0.003, 4, 128); 
            const mainMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true, blending: THREE.AdditiveBlending });
            g.add(new THREE.Mesh(mainGeo, mainMat));

            // 2. Segments Mécaniques (Cyan, plus épais, partiels)
            // On utilise 'arc' pour ne pas faire le tour complet (PI/2 = 90 degrés)
            const segmentGeo = new THREE.TorusGeometry(r, 0.012, 4, 32, Math.PI / 2);
            const segmentMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, opacity: 1, blending: THREE.AdditiveBlending });
            
            // On ajoute 2 segments opposés
            const seg1 = new THREE.Mesh(segmentGeo, segmentMat);
            seg1.rotation.z = 0;
            g.add(seg1);

            const seg2 = new THREE.Mesh(segmentGeo, segmentMat);
            seg2.rotation.z = Math.PI; // Opposé
            g.add(seg2);

            return g;
        }

        const r1 = createTechRing(1.8); r1.rotation.x = 1.6; shieldGroup.add(r1);
        const r2 = createTechRing(2.1); shieldGroup.add(r2);
        const r3 = createTechRing(2.3); r3.rotation.x = 0.8; r3.rotation.y = 0.8; shieldGroup.add(r3);


        // --- 2. ILLUSTRATIONS ---
        const meshesStore = {};
        function generateParticles(count, getPosFn, color = 0x00ffff) {
            const g = new THREE.BufferGeometry(); const v = [];
            for(let i=0; i<count; i++) { const p = getPosFn(i, count); v.push(p.x, p.y, p.z); }
            g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
            return new THREE.Points(g, new THREE.PointsMaterial({ color: color, size: 0.018, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
        }

        function getDNAPos(i,t) { const ti=(i/t)*Math.PI*8; const r=0.6; const s=i%2===0?0:Math.PI; return {x:Math.cos(ti+s)*r, y:(i/t)*4-2, z:Math.sin(ti+s)*r}; }
        function getDomePos(i,t) { const u=Math.random()*6.28; const v=Math.random()*1.57; const r=1.0; const n=(Math.random()-0.5)*0.05; return {x:(r+n)*Math.sin(v)*Math.cos(u), y:(r+n)*Math.sin(v)*Math.sin(u), z:(r+n)*Math.cos(v)}; }
        function getCubePos(i,t) { const s=(Math.random()>0.5)?0.5:1.0; return {x:(Math.random()-0.5)*2*s, y:(Math.random()-0.5)*2*s, z:(Math.random()-0.5)*2*s}; }
        function getPrintPos(i,t) { const ti=i/t*Math.PI*25; const r=(i/t)*1.8; return {x:Math.cos(ti)*r, y:Math.sin(ti)*r*1.4, z:0}; }
        function getLockPos(i,t) { const r=i/t; if(r<0.6) return {x:(Math.random()-0.5)*1.2, y:(Math.random()-0.5)-0.3, z:(Math.random()-0.5)*0.5 }; const a=(r-0.6)*2.5*Math.PI; const rad=0.5; let y=Math.sin(a)*rad+0.3; if(y<0.3)y=0.3; return {x:Math.cos(a)*rad, y:y, z:0}; }
        function getEyePos(i,t) { const r=i/t; if(r<0.2){ const th=Math.random()*6.28; const rad=0.3*Math.sqrt(Math.random()); return{x:rad*Math.cos(th), y:rad*Math.sin(th), z:0.4}; } const ti=Math.random()*6.28; const f=Math.random(); return{x:Math.cos(ti)*1.5*f, y:Math.sin(ti)*0.8*f, z:Math.cos(Math.cos(ti)*1.5*f)*0.5-0.5}; }

        meshesStore["DNA"] = generateParticles(6000, getDNAPos, 0xff00aa);
        meshesStore["DOME"] = generateParticles(8000, getDomePos, 0x00ff00);
        meshesStore["HYPERCUBE"] = generateParticles(8000, getCubePos, 0xffffff);
        meshesStore["FINGERPRINT"] = generateParticles(6000, getPrintPos, 0x00ffff);
        meshesStore["LOCK"] = generateParticles(5000, getLockPos, 0xffaa00);
        meshesStore["EYE"] = generateParticles(5000, getEyePos, 0x0088ff);
        Object.values(meshesStore).forEach(m => { m.visible = false; illusGroup.add(m); });


        // --- 3. MENU ---
        const menuGroup = new THREE.Group(); mainGroup.add(menuGroup);
        const menuKeys = Object.keys(contentData);
        const sprites = [];
        function createText(text) {
            const c = document.createElement('canvas'); const ctx = c.getContext('2d');
            c.width = 512; c.height = 128;
            ctx.font = '500 45px "Orbitron"'; ctx.fillStyle = "white";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.shadowColor = "black"; ctx.shadowBlur = 5; 
            ctx.fillText(text, 256, 64);
            const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
            const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false }));
            s.scale.set(3.5, 0.875, 1); s.userData = { key: text }; return s;
        }
        menuKeys.forEach((k, i) => {
            const s = createText(k); const a = (i/menuKeys.length)*Math.PI*2;
            s.position.set(Math.cos(a)*2.5, Math.sin(a)*2.5, 0.5);
            menuGroup.add(s); sprites.push(s);
        });

        // --- LOGIC ---
        function onScroll() {
            if(state.inWorld || state.isTransitioning) return;
            const el = document.getElementById('vScroll');
            state.targetScroll = el.scrollTop / (el.scrollHeight - el.clientHeight);
        }

        function enterWorld(key) {
            if (state.isTransitioning) return;
            state.inWorld = true; state.isTransitioning = true;
            
            const data = contentData[key];
            document.getElementById('ui-title').innerText = key;
            document.getElementById('ui-text').innerText = data.text;
            document.getElementById('world-ui').classList.add('active');
            document.querySelector('.scroll-indic').style.opacity = 0;

            new TWEEN.Tween(camera.position).to({ z: 1.5 }, 1500).easing(TWEEN.Easing.Cubic.Out).onComplete(() => { state.isTransitioning = false; }).start();
            shieldGroup.children.forEach(c => { if(c.material) new TWEEN.Tween(c.material).to({ opacity: 0 }, 800).start(); else if(c.type==='Group') c.children.forEach(ch=>new TWEEN.Tween(ch.material).to({opacity:0},500).start()); });
            sprites.forEach(s => new TWEEN.Tween(s.material).to({ opacity: 0 }, 500).start());

            const mesh = meshesStore[data.type]; state.currentMesh = mesh;
            if(mesh) { mesh.visible = true; mesh.material.opacity = 0; new TWEEN.Tween(mesh.material).to({ opacity: 1 }, 1500).delay(300).start(); }
        }

        window.exitWorld = function() {
            if (state.isTransitioning) return;
            state.isTransitioning = true;

            document.getElementById('world-ui').classList.remove('active');
            document.querySelector('.scroll-indic').style.opacity = 0.5;

            const el = document.getElementById('vScroll');
            const resetPos = 0.5; 
            state.targetScroll = resetPos; state.scroll = resetPos; el.scrollTop = (el.scrollHeight - el.clientHeight) * resetPos;

            new TWEEN.Tween(camera.position).to({ z: 4.5 }, 1500).easing(TWEEN.Easing.Cubic.Out).onComplete(() => { state.inWorld = false; state.isTransitioning = false; }).start();

            shieldGroup.children.forEach(c => { 
                if(c.type==='Group') c.children.forEach(ch => new TWEEN.Tween(ch.material).to({ opacity: ch.geometry.type === 'TorusGeometry' && ch.geometry.parameters.radius < 0.1 ? 1 : 0.6 }, 1500).start());
                else if(c.material) new TWEEN.Tween(c.material).to({ opacity: c.type==='Points'?0.8:0.3 }, 1500).start();
            });
            sprites.forEach(s => new TWEEN.Tween(s.material).to({ opacity: 1 }, 1000).start());

            if(state.currentMesh) new TWEEN.Tween(state.currentMesh.material).to({ opacity: 0 }, 800).onComplete(() => { state.currentMesh.visible = false; state.currentMesh = null; }).start();
        }

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        window.addEventListener('mousemove', (e) => { mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1; if(!state.inWorld){ mainGroup.rotation.y = mouse.x*0.05; mainGroup.rotation.x = -mouse.y*0.05; }});
        window.addEventListener('click', () => { if(!state.inWorld && !state.isTransitioning && state.scroll > 0.1) { raycaster.setFromCamera(mouse, camera); const h = raycaster.intersectObjects(sprites); if(h.length>0) enterWorld(h[0].object.userData.key); }});
        
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate); TWEEN.update();
            const time = clock.getElapsedTime();
            if (!state.inWorld && !state.isTransitioning) { state.scroll += (state.targetScroll - state.scroll) * 0.1; }

            shieldGroup.rotation.y = time * 0.08;
            r1.rotation.z = -time * 0.2; r2.rotation.y = time * 0.15; r3.rotation.z = time * 0.1;

            if(state.currentMesh) {
                state.currentMesh.rotation.y = time * 0.15;
                if(state.currentMesh === meshesStore["DNA"]) state.currentMesh.rotation.z = Math.sin(time)*0.2;
                if(state.currentMesh === meshesStore["DOME"]) state.currentMesh.rotation.x = 0.5;
            }

            if (!state.inWorld && !state.isTransitioning) {
                camera.position.z = 6 - (state.scroll * 3.5);
                mainGroup.rotation.z = state.scroll * 0.2;
                const op = Math.min((state.scroll - 0.1) * 3, 1);
                sprites.forEach(s => {
                    raycaster.setFromCamera(mouse, camera);
                    const h = raycaster.intersectObject(s).length > 0;
                    s.material.opacity = (h && op > 0.5) ? 1 : Math.max(0, op * 0.6);
                    if(h && op > 0.5) document.body.style.cursor = 'pointer';
                });
                if(raycaster.intersectObjects(sprites).length===0) document.body.style.cursor = 'default';
            }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); });
    </script>
</body>
</html>
